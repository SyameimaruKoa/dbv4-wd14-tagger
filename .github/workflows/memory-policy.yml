name: Low-memory policy

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        paths:
            - memory_policy.py
            - tests/test_memory_policy.py
            - embed_tags_universal.py

jobs:
    memory-policy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Run isolated memory-policy tests
              run: |
                  python -m py_compile memory_policy.py
                  python -m unittest discover -s tests -p 'test_memory_policy.py' -v
